name: Deploy WordPress Docker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ vars.SSH_PRIVATE_KEY }}
          script: |
            if [ ! -d "${{ vars.SERVER_PATH }}/.git" ]; then
              git clone git@github.com:USERNAME/wp-docker.git ${{ vars.SERVER_PATH }}
            fi
 
            cd ${{ vars.SERVER_PATH }}
            git pull origin main
            docker compose down
            docker compose up -d --build